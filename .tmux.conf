# ==============================================================================
# FILE: .tmux.conf
# DESCRIPTION: Terminal multiplexer configuration.
#              Remaps the prefix to Ctrl+a, enables true 256-color support,
#              increases scrollback to 50k lines, integrates Vim pane navigation,
#              and loads the Catppuccin theme via the Tmux Plugin Manager (TPM).
# ==============================================================================

# --- Prefix ---
# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Core Settings ---
# Upgrade $TERM to support true colors and italics
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer size to 50,000 lines
set -g history-limit 50000

# Remove escape delay (crucial for Vim users)
set -sg escape-time 10

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# --- Key Bindings ---
# Reload configuration easily
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Pane navigation with Vim keys (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation with Arrow keys
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


