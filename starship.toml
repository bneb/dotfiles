# ~/.config/starship.toml
# ==============================================================================
# FILE: starship.toml
# DESCRIPTION: Cross-shell prompt configuration.
#              Defines a highly condensed, high-density prompt with Nerd Font
#              vector icons, Git status indicators, and execution time metrics.
#              Optimized for instant load times and visual ergonomics.
# ==============================================================================

# Wait 10 milliseconds for starship to check files under the current directory.

format = """
$directory\
$git_branch\
$git_status\
${custom.jj}\
$git_state\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold bright-blue"
read_only = " 󰌾"
truncation_length = 5
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold bright-magenta)"
error_symbol = "[❯](bold bright-red)"
vicmd_symbol = "[❮](bold bright-yellow)"

[git_branch]
symbol = "on  "
style = "bold bright-purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind] )'
conflicted = "[=${count}](bold red) "
ahead = "[⇡${count}](bold blue) "
behind = "[⇣${count}](bold blue) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bold purple) "
untracked = "[?${count}](bold bright-black) "
stashed = "[$${count}](bold bright-black) "
modified = "[~${count}](bold yellow) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](bold cyan) "
deleted = "[-${count}](bold red) "

[nodejs]
symbol = "󰎙 "
style = "bold bright-green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "bold bright-yellow"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "bold bright-red"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold bright-cyan"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 500
format = "took [$duration](bold bright-yellow)"

[custom.jj]
when = "jj-starship detect"
shell = ["jj-starship"]
format = "$output "
